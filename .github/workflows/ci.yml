name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: office_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:ci-only@localhost:5432/office_test
      BETTER_AUTH_SECRET: ci-only-not-a-real-secret-0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Check every schema change has a migration
        run: |
          npm run db:generate
          git status --porcelain -- src/db/migrations
          test -z "$(git status --porcelain -- src/db/migrations)"
      # The same command that the Migrate production workflow runs.
      - run: npm run db:migrate
      - run: npm test
      - run: npm run build
